<!DOCTYPE html>
<html>

<head>
    <title>Simple Debug</title>
</head>

<body>
    <div id="result"></div>
    <div id="questions"></div>

    <script>
        window.debugInfo = {
            beforeAppLoad: {
                dateSelect: !!document.getElementById("quiz-date"),
                questionsContainer: !!document.getElementById("questions")
            }
        };
    </script>

    <script src="app.js"></script>

    <script>
        setTimeout(() => {
            window.debugInfo.afterAppLoad = {
                appLoaded: window.__appLoaded,
                dateSelectExists: !!document.getElementById("quiz-date"),
                questionsContainerExists: !!document.getElementById("questions"),
                dateSelectValue: document.getElementById("quiz-date") ? document.getElementById("quiz-date").innerHTML : "N/A",
                questionsHTML: document.getElementById("questions") ? document.getElementById("questions").innerHTML.substring(0, 100) : "N/A"
            };

            document.getElementById("result").innerHTML = "<pre>" + JSON.stringify(window.debugInfo, null, 2) + "</pre>";
        }, 1000);
    </script>
</body>

</html>
