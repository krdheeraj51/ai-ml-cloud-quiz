<!DOCTYPE html>
<html>

<head>
    <title>Fetch Test</title>
</head>

<body>
    <h1>Fetch Test</h1>
    <div id="result"></div>

    <script>
        (async () => {
            const result = document.getElementById("result");
            try {
                result.innerHTML += "<p>Testing manifest fetch...</p>";
                const r1 = await fetch("/data/manifest.json?t=" + Date.now());
                result.innerHTML += `<p>Manifest status: ${r1.status}, OK: ${r1.ok}</p>`;
                if (r1.ok) {
                    const data = await r1.json();
                    result.innerHTML += `<p>Manifest data: ${JSON.stringify(data)}</p>`;

                    if (data.dates && data.dates.length > 0) {
                        const date = data.dates[0];
                        result.innerHTML += `<p>Testing quiz fetch for: ${date}</p>`;
                        const [y, m, d] = date.split("-");
                        const url = `/data/${y}/${m}/${d}.json`;
                        result.innerHTML += `<p>URL: ${url}</p>`;
                        const r2 = await fetch(url);
                        result.innerHTML += `<p>Quiz status: ${r2.status}, OK: ${r2.ok}</p>`;
                        if (r2.ok) {
                            const quiz = await r2.json();
                            result.innerHTML += `<p>Quiz title: ${quiz.title}, Questions: ${quiz.questions.length}</p>`;
                            result.innerHTML += `<p style="color:green;"><strong>SUCCESS! Quiz data loaded correctly.</strong></p>`;
                        }
                    }
                }
            } catch (err) {
                result.innerHTML += `<p style="color:red;">ERROR: ${err.message}</p>`;
            }
        })();
    </script>
</body>

</html>
